name: Check JAKIM zones

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 09:00 MYT
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-zones.mjs
